<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기솔의 HSK 5급 단어장</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HSK 5급 단어장">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --card:#f6f8fb; --ink:#1f2433; --muted:#6b7385; --line:#e3e7ef;
  --accent:#ff4d6d; --accent-soft:#ffe3e9; --ok:#16b981; --ok-soft:#d9f7ea; --warn:#f5a524;
  --shadow:0 8px 24px rgba(30,40,80,.08), 0 1px 3px rgba(30,40,80,.06);
  --zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --ko:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;
}
body.f-system{--ko:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
body.f-notokr{--ko:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;--zh:"Noto Sans SC","PingFang SC",sans-serif}
body.f-plex{--ko:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;--zh:"Noto Sans SC","PingFang SC",sans-serif}
body.f-gowun{--ko:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;--zh:"Noto Sans SC","PingFang SC",sans-serif}
body.f-serif{--ko:"Gowun Batang","Apple SD Gothic Neo",serif;--zh:"Noto Serif SC","Songti SC",serif}
body.f-xiaowei{--ko:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;--zh:"ZCOOL XiaoWei","Noto Serif SC",serif}
.setrow{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:15px;font-weight:600}
.setrow .chev{font-size:22px;color:var(--muted);transition:.2s;line-height:1}
.setrow .chev.open{transform:rotate(90deg)}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:#d6dae3;position:relative;cursor:pointer;padding:0}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:#8b5cf6}.switch.on i{left:23px}
/* dark mode */
body.dark{--bg:#12141c;--card:#1b1e29;--ink:#f1f3f8;--muted:#9aa3b5;--line:#2b3040;--accent:#ff6b86;--accent-soft:#3a1f28;--ok:#34d399;--ok-soft:#163a2e;--shadow:0 8px 24px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3)}
body.dark .card,body.dark .ghost,body.dark .tile,body.dark .today,body.dark .row,body.dark .stat,body.dark .cell,body.dark .btn,body.dark .confirm .box,body.dark .done .bubble,body.dark .daydetail,body.dark .setrow,body.dark .fontpick button,body.dark .calhead button,body.dark .seg button.on,body.dark .progress .auto{background:var(--card);color:var(--ink)}
body.dark .card.flipped{background:var(--card)}
body.dark .cell.empty{background:transparent}
body.dark .cell.act{background:#1f3b2e;border-color:#2a5a42}body.dark .cell.act2{background:#2a6a48}
body.dark .cell.sel{background:#8b5cf6;border-color:#8b5cf6}
body.dark .sheet{background:#161923}
body.dark .seg{background:#262a38}
body.dark .daydetail .dd div{background:#262a38}
body.dark .btn.primary{background:#8b5cf6;color:#fff}body.dark .btn.ok{background:#22c55e;color:#fff}body.dark .btn.bad{background:#ff4d6d;color:#fff}
body.dark .tile.wrong .ico{background:#3a1f28;color:#ff6b86}body.dark .tile.share .ico{background:#1f2a44;color:#7aa2ff}
body.dark .done .bubble:after{background:var(--card);border-color:var(--line)}
body.dark textarea{background:var(--card);color:var(--ink)}
body.dark .picker .pmark{background:#4a3f12}
body.dark .toast{background:#f1f3f8;color:#12141c}
.fontpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fontpick button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 8px;text-align:left;cursor:pointer}
.fontpick button.on{border-color:var(--ink)}
.fontpick .fz{font-size:22px;line-height:1.2}
.fontpick .fk{font-size:13px;color:var(--muted);margin-top:2px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
@media (display-mode: standalone){ body{padding-top:calc(env(safe-area-inset-top) + 14px)} header{padding-top:10px} }
button{font-family:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
header h1 small{font-weight:500;color:var(--muted);margin-left:6px;font-size:13px}
.iconbtn{background:none;border:0;font-size:22px;line-height:1;padding:6px 8px;border-radius:10px;cursor:pointer;color:var(--muted)}
.iconbtn:active{background:var(--line)}
main{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 16px}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.active{display:flex}

/* progress line */
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:4px 2px 10px}
.progress .bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:#22c55e;border-radius:3px;transition:width .25s}
.progress b{color:var(--ink);font-weight:600}
.progress .auto{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer;font-weight:600}
.progress .auto.on{background:#ffd60a;border-color:#ffd60a;color:#3b2f00}
.picker{display:flex;align-items:center;gap:10px;padding:0 2px 10px;font-size:13px;color:var(--muted)}
.picker .pwrap{flex:1;position:relative;height:36px}
.picker .pscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:36px;align-items:center;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 calc(50% - 22px)}
.picker .pscroll::-webkit-scrollbar{display:none}
.picker .pscroll span{flex:none;width:44px;text-align:center;scroll-snap-align:center;font-size:14px;color:var(--muted);line-height:36px}
.picker .pscroll span.on{color:var(--ink);font-weight:700;font-size:16px}
.picker .pmark{position:absolute;left:50%;top:4px;bottom:4px;width:44px;transform:translateX(-50%);border-radius:10px;background:#fff3b0}
.picker .pscroll{position:relative}
.picker .pl{white-space:nowrap}
.picker .pv{font-weight:700;color:var(--ink);min-width:40px;text-align:right}
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;background:#fff;color:var(--ink);margin-bottom:8px;font-family:inherit;-webkit-appearance:none}
.row .st{font-size:11px;color:var(--muted);white-space:nowrap;background:var(--card);border-radius:999px;padding:3px 8px}
.card .spk{position:absolute;top:12px;left:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.card .spk svg{width:18px;height:18px}
.card .spk:active{background:var(--card)}
.card .koBig{font-size:24px;line-height:1.5;text-align:center}
.card .koBig .pos{color:var(--muted);font-size:16px;margin-right:5px}
.card .koBig .kl+.kl{margin-top:4px}
.card.rev .zh{margin-top:18px}
.card.hidden-front .zh,.card.hidden-front .py{visibility:hidden}
.card.flipped.hidden-front .zh,.card.flipped.hidden-front .py{visibility:visible;animation:fade .25s ease}
.card .timer{position:absolute;left:0;right:0;top:0;height:4px;background:#ffd60a;transform-origin:left;border-radius:22px 22px 0 0}

/* card stage */
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;perspective:1200px;touch-action:pan-y}
.card{position:absolute;inset:4px 2px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:30% 22px 28px;text-align:center;user-select:none;-webkit-user-select:none;will-change:transform;transition:transform .12s ease-out,opacity .12s ease-out}
.card.dragging{transition:none}
.card .lv{position:absolute;top:16px;left:18px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.card .stagebadge{position:absolute;top:14px;right:16px;font-size:12px;color:var(--muted);background:var(--card);padding:4px 9px;border-radius:999px}
.card .zh{font-family:var(--zh);font-weight:500;line-height:1.1;letter-spacing:.02em;word-break:keep-all}
.card .py{margin-top:16px;font-size:26px;color:var(--accent);font-family:var(--zh);font-weight:400;letter-spacing:.02em}
.card .ko{margin-top:12px;font-size:18px;line-height:1.55;color:var(--ink);text-align:left;display:inline-block}
.card .ko .pos{color:var(--muted);font-size:14px;margin-right:5px;letter-spacing:-.5px}
.card .hint{position:absolute;bottom:18px;left:0;right:0;font-size:13px;color:var(--muted)}
.card.hidden-back .py,.card.hidden-back .ko{visibility:hidden}
.card .flipwrap{display:flex;flex-direction:column;align-items:center}
.card.flipped{background:#fff}
.card.flipped .py,.card.flipped .ko{visibility:visible;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ghost{position:absolute;inset:14px 10px -6px;background:#fff;border:1px solid var(--line);border-radius:22px;opacity:.55;box-shadow:var(--shadow);transform:scale(.97)}

/* bottom controls */
.controls{display:flex;gap:10px;padding:14px 0 10px}
.btn{flex:1;border:1px solid var(--line);border-radius:14px;padding:15px 10px;font-size:16px;font-weight:600;cursor:pointer;background:#fff}
.btn:active{transform:translateY(1px)}
.btn.primary{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
.btn.ghostbtn{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ok{background:#1ed760;border-color:#1ed760;color:#fff}
.btn.bad{background:#ff4d6d;border-color:#ff4d6d;color:#fff}
.btn.danger{background:#ff0000;border-color:#ff0000;color:#fff}
.btn.warn{background:#ff9500;border-color:#ff9500;color:#fff}

/* empty / done states */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:30px 10px;gap:8px}
.empty .big{font-size:44px}
.empty h2{margin:6px 0 0;color:var(--ink);font-size:20px}
.empty p{margin:0;font-size:15px;line-height:1.55}
.empty .btn{flex:none;margin-top:14px;padding:13px 22px}

/* list (wrong words) */
.list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row .zh{font-family:var(--zh);font-size:26px;min-width:64px;font-weight:500}
.row .meta{flex:1;min-width:0}
.row .py{color:var(--accent);font-size:14px;font-family:var(--zh)}
.row .ko{font-size:14px;color:var(--ink);margin-top:2px;line-height:1.4}
.row .ko .pos{color:var(--muted);margin-right:3px}
.row .ko .kl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrbtn{flex:none;margin:0 0 12px;padding:14px;font-size:15px;width:100%}
.wrbtn.dim{background:#d6dae3;border-color:#d6dae3;color:#fff}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:14px 4px 8px}
.grp:first-child{padding-top:2px}
.row .mini{font-size:12px;color:var(--muted);white-space:nowrap}
.grp .cnt{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px}
.row .del{border:0;background:none;color:var(--muted);font-size:20px;padding:4px 6px;cursor:pointer}
.listhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;padding:2px 4px 10px}
.row.small .zh{font-size:22px;min-width:54px}

/* home */
.home{flex:1;display:flex;flex-direction:column;gap:12px;padding:4px 0 24px;overflow:auto}
.foot{margin-top:auto;padding-top:18px;text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.2px}
.banner{background:linear-gradient(160deg,#a78bfa 0%,#8b5cf6 55%,#7c3aed 100%);border-radius:18px 0 0 18px;padding:18px 20px 16px;color:#fff;box-shadow:0 10px 24px rgba(124,58,237,.32),0 2px 4px rgba(0,0,0,.06);position:relative;overflow:hidden}
.banner .bt{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;opacity:.95}
.banner .bt .em{font-size:20px}
.banner .big{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.banner .big b{font-size:40px;line-height:1;letter-spacing:-1px}
.banner .big span{font-size:15px;opacity:.9}
.banner .bbar{height:10px;background:rgba(255,255,255,.3);border-radius:5px;overflow:hidden;margin-top:12px}
.banner .bbar i{display:block;height:100%;background:#fff;border-radius:5px;transition:width .3s}
.banner .bsub{display:flex;justify-content:space-between;font-size:12.5px;margin-top:8px;opacity:.9}
.today{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px;box-shadow:var(--shadow)}
.today .th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.today .th b{font-size:15px}
.today .th span{font-size:12px;color:var(--muted)}
.today .nums{display:flex}
.today .num{flex:1;text-align:center;padding:10px 0 6px}
.today .num+.num{border-left:1px solid var(--line)}
.today .num .v{font-size:46px;font-weight:700;line-height:1;letter-spacing:-1px}
.today .num .v small{font-size:20px;color:var(--ink);font-weight:600;margin-left:3px;letter-spacing:0}
.today .num .l{font-size:14px;color:var(--ink);font-weight:600;margin-top:8px}
.today .num.done .v{color:var(--ok)}
.overall{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);margin-top:16px}
.overall .bar{flex:1;height:8px;background:var(--line);border-radius:3px;overflow:hidden}
.overall .bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.overall b{color:var(--ink);font-size:17px}
.actions{display:flex;gap:10px;margin:14px 0 4px}
.actions button{flex:1;border:0;border-radius:999px;padding:16px 10px;font-size:17px;font-weight:700;cursor:pointer;color:#fff}
.actions button:active{transform:scale(.98)}
.actions .go-learn{background:#3ddc84;box-shadow:0 6px 16px rgba(61,220,132,.35)}
.actions .go-review{background:#ffd60a;color:#fff;position:relative;box-shadow:0 6px 16px rgba(255,214,10,.38)}
.actions .go-review .pill{position:absolute;top:-8px;right:10px;background:#ff4d6d;color:#fff;font-size:11px;border-radius:999px;padding:2px 8px}
.actions button.finished{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.actions .go-review.none{background:#ffd60a;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .tile{padding:16px 14px;gap:12px;border-radius:18px}
.grid2 .tile .ico{width:44px;height:44px;border-radius:13px}
.grid2 .tile .ico svg{width:24px;height:24px}
.grid2 .tile .t b{font-size:16px}
.grid2 .tile .arrow{display:none}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid3 .tile{flex-direction:column;align-items:center;text-align:center;padding:14px 8px;gap:8px;border-radius:18px}
.grid3 .tile .ico{width:44px;height:44px;border-radius:13px}
.grid3 .tile .ico svg{width:24px;height:24px}
.grid3 .tile .t b{font-size:14px;margin-bottom:1px}
.grid3 .tile .t span{font-size:12px}
.grid3 .tile .arrow{display:none}
.tile.cal .ico{background:#dcfce7;color:#16a34a}
.calwrap{flex:1;overflow:auto;padding-bottom:16px}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px}
.calhead b{font-size:18px}
.calhead button{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:20px;grid-auto-rows:46px;gap:6px}
.calgrid .dow{grid-row:1}
.calgrid .dow{text-align:center;font-size:12px;color:var(--muted);height:20px;line-height:20px}
.calgrid .dow.sun{color:#ff4d6d}
.cell{height:46px;min-width:0;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:14px;position:relative;overflow:hidden}
.cell.empty{border:0;background:transparent;cursor:default}
.cell.act{background:#dcfce7;border-color:#bbf7d0}
.cell.act2{background:#86efac;border-color:#4ade80;color:#064e3b}
.cell.today>span{color:#16a34a;font-weight:700}
.cell.sel{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
.cell.sel>span{color:#fff}
.cell.sel .dots i{background:#fff}
.cell.sel .dots .dr{background:#ffe066}
.cell .dots{display:flex;gap:3px;height:6px;flex:none}
.cell>span{line-height:1}
.cell .dots i{width:6px;height:6px;border-radius:50%;display:block}
.cell .dots .dl{background:#22c55e}.cell .dots .dr{background:#f5a524}
.cell.future{color:#c3c8d3}
.daydetail{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.daydetail h3{margin:0 0 10px;font-size:16px}
.daydetail .dd{display:flex;gap:10px}
.daydetail .dd div{flex:1;background:var(--card);border-radius:12px;padding:12px;text-align:center}
.daydetail .dd b{display:block;font-size:26px}
.daydetail .dd span{font-size:12px;color:var(--muted)}
.daydetail p{margin:10px 0 0;font-size:13px;color:var(--muted)}
.tile.share .ico{background:#e4ecff;color:#3b82f6}
.sharebtn{display:none;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:600;background:var(--ink);color:#fff;cursor:pointer}
.sharebtn svg{width:18px;height:18px}
.shareimg{width:100%;border-radius:14px;box-shadow:var(--shadow);display:block;margin:4px 0 10px}
.sheet.share h2 span{font-size:17px}
.tile{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 20px;text-align:left;box-shadow:var(--shadow);cursor:pointer;position:relative;width:100%}
.tile:active{transform:scale(.985)}
.tile .ico{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.tile .ico svg{width:30px;height:30px}
.tile.learn .ico{background:#fde8d7;color:#d9652b}
.tile.review .ico{background:#dcebf7;color:#2f6fa8}
.tile.wrong .ico{background:#ffe3e9;color:#ff4d6d}
.tile .t{flex:1}
.tile .t b{display:block;font-size:19px;margin-bottom:3px}
.tile .t span{font-size:13px;color:var(--muted)}
.tile .arrow{color:var(--line);font-size:22px}
.tile .pill{position:absolute;top:14px;right:16px;background:var(--accent);color:#fff;font-size:11px;border-radius:999px;padding:2px 8px;font-weight:700}
.back{background:none;border:0;font-size:22px;padding:4px 10px 4px 0;cursor:pointer;color:var(--ink);line-height:1}
.hdr-left{display:flex;align-items:center;gap:2px}
.hdr-right{display:flex;align-items:center;gap:2px}
.iconbtn svg{display:block}
.done{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 10px 20px;gap:4px}
.done .cat{width:170px;height:auto;-webkit-mask-image:linear-gradient(#000 78%,transparent 100%);mask-image:linear-gradient(#000 78%,transparent 100%);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.done h2{margin:12px 0 4px;font-size:23px;color:var(--ink);letter-spacing:-.3px}
.done p{margin:0;color:var(--muted);font-size:15px;line-height:1.55}
.done .bubble{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-size:14px;color:var(--ink);box-shadow:0 1px 0 var(--line);margin-bottom:6px;position:relative}
.done .bubble:after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(40,30,20,.35);display:none;align-items:flex-end;z-index:20}
.sheet-bg.open{display:flex}
.sheet{background:#f6f8fb;width:100%;max-height:88vh;border-radius:22px 22px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:17px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.sheet h3{font-size:13px;color:var(--muted);margin:18px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;background:var(--card);color:var(--ink);resize:vertical}
.rowbtns{display:flex;gap:8px;margin-top:8px}
.rowbtns .btn{padding:12px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;font-size:14px;text-align:center;line-height:1.5;max-width:86%;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 0 0}
input[type=file]{font-size:13px}
.confirm{position:fixed;inset:0;background:rgba(40,30,20,.35);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
.confirm.open{display:flex}
.confirm .box{background:var(--card);border-radius:18px;padding:20px;max-width:340px;width:100%;box-shadow:var(--shadow)}
.confirm p{margin:0 0 16px;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="hdr-left"><button class="back" id="backBtn" style="display:none" aria-label="홈으로">‹</button><h1 id="title">기솔의 HSK 5급 단어장 <small id="subtitle"></small></h1></div>
  <div class="hdr-right">
    <button class="iconbtn" id="openSearch" aria-label="단어 검색"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="iconbtn" id="openCal" aria-label="학습 캘린더"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    <button class="iconbtn" id="openSheet" aria-label="설정">☰</button>
  </div>
</header>

<main>
  <!-- 홈 -->
  <section class="view active" id="view-home">
    <div class="home">
      <div class="banner">
        <div class="bt"><span class="em">✏️</span>나의 단어 진도</div>
        <div class="big"><b id="bnN">0</b><span>/ 2600 단어</span><span id="bnPct" style="margin-left:auto;font-size:18px;font-weight:700"></span></div>
        <div class="bbar"><i id="bnBar"></i></div>
        <div class="bsub"><span id="bnLeft"></span><span id="bnDays"></span></div>
      </div>
      <div class="today">
        <div class="th"><b>오늘의 계획</b><span id="todayDate"></span></div>
        <div class="nums">
          <div class="num" id="numLearn"><div class="v"><span id="tLearn">0</span><small>/ 100</small></div><div class="l">학습한 단어</div></div>
          <div class="num" id="numReview"><div class="v"><span id="tReview">0</span><small id="tReviewMax">/ 0</small></div><div class="l">복습한 단어</div></div>
        </div>
        <div class="actions">
          <button class="go-learn" data-go="learn" id="goLearn">학습하기</button>
          <button class="go-review" data-go="review" id="goReview">복습하기<span class="pill" id="homePill" style="display:none"></span></button>
        </div>
      </div>
      <div class="grid2">
        <button class="tile wrong" data-go="wrong">
          <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></div>
          <div class="t"><b>틀린단어</b><span id="homeWrong"></span></div>
        </button>
        <button class="tile share" id="shareBtn">
          <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></div>
          <div class="t"><b>진도 보내기</b><span>이미지로 공유</span></div>
        </button>
      </div>
      <div class="foot">© 2026 Bona Kim · All rights reserved</div>
    </div>
  </section>

  <!-- 학습 -->
  <section class="view active" id="view-learn">
    <div class="progress"><span><b id="learnDone">0</b>/<span id="learnTotal">100</span></span><div class="bar"><i id="learnBar"></i></div></div>
    <div class="stage" id="learnStage"></div>
    <div class="controls" id="learnControls">
      <button class="btn ghostbtn" id="learnPrev">← 이전</button>
      <button class="btn primary" id="learnNext">다음 →</button>
    </div>
  </section>

  <!-- 복습 -->
  <section class="view" id="view-review">
    <div class="progress"><span><b id="revDone">0</b>/<span id="revTotal">0</span></span><div class="bar"><i id="revBar"></i></div><span id="revInfo"></span><button class="auto" id="autoBtn">자동 OFF</button></div>
    <div class="picker" id="picker" style="display:none"><span class="pl">넘김 간격</span><div class="pwrap"><div class="pmark"></div><div class="pscroll" id="pscroll"></div></div><span class="pv" id="pval">1.3초</span></div>
    <div class="stage" id="reviewStage"></div>
    <div class="controls" id="reviewControls">
      <button class="btn warn" id="revFlip">몰라요</button>
      <button class="btn ok" id="revKnow">알아요</button>
    </div>
  </section>

  <!-- 달력 -->
  <section class="view" id="view-cal">
    <div class="calwrap">
      <div class="calhead"><button id="calPrev">‹</button><b id="calTitle"></b><button id="calNext">›</button></div>
      <div class="calgrid" id="calGrid"></div>
      <div class="daydetail" id="dayDetail"></div>
    </div>
  </section>

  <!-- 검색 -->
  <section class="view" id="view-search">
    <input class="search" id="searchBox" type="search" placeholder="한자, 병음, 뜻으로 검색" autocomplete="off">
    <div class="listhead"><span id="searchCount"></span></div>
    <div class="list" id="searchList"></div>
  </section>

  <!-- 틀린단어 -->
  <section class="view" id="view-wrong">
    <button class="btn primary wrbtn" id="wrongReview">틀린단어 카드로 복습하기</button>
    <div class="listhead"><span id="wrongCount"></span><div class="seg" id="wrongSort"><button data-s="count" class="on">틀린 횟수</button><button data-s="recent">최근순</button><button data-s="old">오래된순</button></div></div>
    <div class="list" id="wrongList"></div>
  </section>
</main>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h2>진도 <button class="iconbtn" id="closeSheet">✕</button></h2>
    <div class="stats" id="stats"></div>
    <h3>설정</h3>
    <div class="setrow"><span>다크 모드</span><button class="switch" id="darkBtn" aria-label="다크 모드"><i></i></button></div>
    <div class="setrow"><span>학습할 때 자동 발음</span><button class="switch" id="speakBtn" aria-label="자동 발음"><i></i></button></div>
    <button class="setrow" id="fontToggle" style="width:100%;cursor:pointer;font-family:inherit"><span>글꼴</span><span class="chev" id="fontChev">›</span></button>
    <div class="fontpick" id="fontpick" style="display:none">
      <button data-f="system"><div class="fz" style="font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif">产生 chǎnshēng</div><div class="fk" style="font-family:-apple-system,'Apple SD Gothic Neo',sans-serif">기본 (폰 글꼴)</div></button>
      <button data-f="notokr"><div class="fz" style="font-family:'Noto Sans SC'">产生 chǎnshēng</div><div class="fk" style="font-family:'Noto Sans KR'">노토 산스</div></button>
      <button data-f="plex"><div class="fz" style="font-family:'Noto Sans SC'">产生 chǎnshēng</div><div class="fk" style="font-family:'IBM Plex Sans KR'">IBM 플렉스</div></button>
      <button data-f="gowun"><div class="fz" style="font-family:'Noto Sans SC'">产生 chǎnshēng</div><div class="fk" style="font-family:'Gowun Dodum'">고운돋움</div></button>
      <button data-f="serif"><div class="fz" style="font-family:'Noto Serif SC'">产生 chǎnshēng</div><div class="fk" style="font-family:'Gowun Batang'">명조 (고운바탕)</div></button>
      <button data-f="xiaowei"><div class="fz" style="font-family:'ZCOOL XiaoWei'">产生 chǎnshēng</div><div class="fk" style="font-family:'Gowun Dodum'">샤오웨이 + 고운돋움</div></button>
    </div>
    <h3>백업</h3>
    <p class="note">폰을 바꾸거나 브라우저 데이터를 지우면 진도가 사라져요. 가끔 백업 코드를 복사해서 메모장에 저장해 두세요.</p>
    <div class="rowbtns"><button class="btn" id="copyBackup">백업 코드 복사</button><button class="btn" id="showImport">불러오기</button></div>
    <div id="importArea" style="display:none">
      <textarea id="importBox" placeholder="백업 코드를 여기에 붙여넣기"></textarea>
      <div class="rowbtns"><button class="btn primary" id="doImport">불러오기 실행</button></div>
    </div>
    <h3>초기화</h3>
    <div class="rowbtns"><button class="btn bad danger" id="resetAll">모든 진도 지우기</button></div>
  </div>
</div>

<div class="sheet-bg" id="shareBg">
  <div class="sheet share">
    <h2><span>진도 카드</span> <button class="iconbtn" id="closeShare">✕</button></h2>
    <img class="shareimg" id="shareImg" alt="진도 카드">

  </div>
</div>

<script>
(function(){
'use strict';
/* ---------- data ---------- */
const WORDS = JSON.parse(document.getElementById('words').textContent);
const BY_ID = {}; WORDS.forEach(w=>BY_ID[w.id]=w);
// fixed-seed shuffle within each level: HSK4 first, then HSK5
function seeded(seed){ let s=seed>>>0; return ()=>{ s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function shuffle(arr,seed){ const r=seeded(seed); const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const ORDER = shuffle(WORDS.filter(w=>w.lv===4).map(w=>w.id),20261106).concat(shuffle(WORDS.filter(w=>w.lv===5).map(w=>w.id),20261107));
const TOTAL = ORDER.length;
const DAILY_NEW = 100, DAILY_REVIEW = 100, EXTRA_REVIEW = 50; // 복습 하루 100개: 틀린 적 있는 단어 먼저, 나머지는 랜덤
const INTERVALS = [1,3,7,14,30,60]; // days until next review by stage; past last stage = 완료
const KEY = 'hsk_vocab_v1';

/* ---------- state ---------- */
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(dateStr,n){ const [y,m,d]=dateStr.split('-').map(Number); const dt=new Date(y,m-1,d+n); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000); }

let S = load();
function fresh(){ return {v:1, learnedIdx:0, cards:{}, wrong:{}, days:{}, learnBatch:{date:null,ids:[],pos:0}, revQueue:{date:null,ids:[],pos:0}, started:today()}; }
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); if(s&&s.v===1) return s; } }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function day(d){ d=d||today(); if(!S.days[d]) S.days[d]={learned:0,reviewed:0,known:0,wrong:0}; return S.days[d]; }

/* ---------- learn batch ---------- */
function ensureLearnBatch(){
  const t=today();
  if(S.learnBatch.date!==t){
    // commit nothing; new day -> next 100 words from learnedIdx
    const ids=ORDER.slice(S.learnedIdx, S.learnedIdx+DAILY_NEW);
    S.learnBatch={date:t, ids, pos:0};
    save();
  }
}
function learnCurrent(){ ensureLearnBatch(); const b=S.learnBatch; return b.pos<b.ids.length ? BY_ID[b.ids[b.pos]] : null; }
function learnAdvance(dir){
  const b=S.learnBatch;
  if(dir>0){
    if(b.pos>=b.ids.length) return;
    const id=b.ids[b.pos];
    if(!S.cards[id]){ // first time seen -> schedule review tomorrow
      S.cards[id]={stage:0, due:addDays(today(),1), seen:today()};
      S.learnedIdx=Math.max(S.learnedIdx, ORDER.indexOf(id)+1);
      day().learned++;
    }
    b.pos++;
  }else{ if(b.pos>0) b.pos--; }
  save(); renderLearn();
}

/* ---------- review queue ---------- */
function dueIds(){
  const t=today();
  return Object.keys(S.cards).filter(id=>{ const c=S.cards[id]; return c.stage<INTERVALS.length && c.due<=t; })
    .sort((a,b)=>{ const ca=S.cards[a],cb=S.cards[b]; if(ca.due!==cb.due) return ca.due<cb.due?-1:1; if(ca.stage!==cb.stage) return ca.stage-cb.stage; return ORDER.indexOf(+a)-ORDER.indexOf(+b); })
    .map(Number);
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
// 오늘 복습할 단어 고르기: 대기 중인 단어 가운데 틀린 적 있는 단어 먼저(많이 틀린 순), 나머지는 랜덤
function pickReview(n, exclude){
  const ex=exclude||new Set(); const due=dueIds().filter(id=>!ex.has(String(id)));
  const wrong=due.filter(id=>S.wrong[id]).sort((a,b)=>(S.wrong[b].count-S.wrong[a].count)||(S.cards[a].due<S.cards[b].due?-1:1));
  const rest=shuffle(due.filter(id=>!S.wrong[id]));
  return wrong.concat(rest).slice(0,n);
}
function ensureRevQueue(){
  const t=today(); const q=S.revQueue;
  if(q.date!==t){
    S.revQueue={date:t, ids:pickReview(DAILY_REVIEW), pos:0, flipped:false, v:2};
    save();
  } else if(q.v!==2){
    // 예전 방식으로 만든 오늘 큐: 이미 푼 것은 그대로 두고 나머지를 새 방식으로 채움 (총 100개)
    const done=q.ids.slice(0,q.pos); const need=Math.max(0,DAILY_REVIEW-done.length);
    q.ids=done.concat(pickReview(need,new Set(done.map(String)))); q.v=2; save();
  }
}
let revMode='daily'; let WQ={ids:[],pos:0,flipped:false,known:0,wrong:0};
function curQ(){ return revMode==='wrong' ? WQ : S.revQueue; }
function extendReview(){
  ensureRevQueue(); const q=S.revQueue; const inQ=new Set(q.ids);
  const more=pickReview(EXTRA_REVIEW,new Set([...inQ].map(String)));
  if(!more.length){ toast('더 복습할 단어가 없어요'); return; }
  q.ids=q.ids.concat(more); q.flipped=false; save(); renderReview(); toast(`${more.length}개 추가했어요`);
}
function revCurrent(){ ensureRevQueue(); const q=curQ(); return q.pos<q.ids.length ? BY_ID[q.ids[q.pos]] : null; }
function revAnswer(known){
  const q=curQ(); if(q.pos>=q.ids.length) return;
  const id=q.ids[q.pos]; const t=today();
  if(revMode==='wrong'){
    if(known) q.known++; else { q.wrong++; const w=S.wrong[id]||{count:0,last:null,first:t}; w.count++; w.last=t; if(!w.first) w.first=t; S.wrong[id]=w; }
    q.pos++; q.flipped=false; save(); renderReview(); return;
  }
  const c=S.cards[id];
  if(known){ c.stage++; c.due = c.stage<INTERVALS.length ? addDays(t, INTERVALS[c.stage]) : null; day().known++; }
  else{ c.stage=0; c.due=addDays(t,1); day().wrong++; (day().wrongIds=day().wrongIds||[]).push(id); const w=S.wrong[id]||{count:0,last:null,first:t}; w.count++; w.last=t; if(!w.first) w.first=t; S.wrong[id]=w; }
  c.last=t; day().reviewed++;
  q.pos++; q.flipped=false;
  save(); renderReview(); updateBadge();
}

const $=s=>document.querySelector(s);
function zhSize(len){ return len<=1?'62px':len===2?'54px':len===3?'46px':len===4?'40px':'32px'; }
function koHTML(w){ return w.m.map(([p,m])=>`<div class="kl">${p?`<span class="pos">(${p})</span>`:''}${m}</div>`).join(''); }
const SPK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
function cardHTML(w, opts){
  const body = opts.reverse
    ? `<div class="koBig">${koHTML(w)}</div><div class="zh" style="font-size:${zhSize(w.zh.length)}">${w.zh}</div><div class="py">${w.py}</div>`
    : `<div class="zh" style="font-size:${zhSize(w.zh.length)}">${w.zh}</div><div class="py">${w.py}</div><div class="ko">${koHTML(w)}</div>`;
  return `<div class="ghost"></div>
  <div class="card ${opts.reverse?'rev':''} ${opts.hideBack?(opts.reverse?'hidden-front':'hidden-back'):''}" id="${opts.id}">
    ${opts.speak?`<button class="spk" data-say="${w.zh}" aria-label="발음 듣기">${SPK}</button>`:''}
    ${opts.badge?`<span class="stagebadge">${opts.badge}</span>`:''}
    <div class="flipwrap">${body}</div>
    <div class="hint">${opts.hint||''}</div>
  </div>`;
}

let zhVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); zhVoice = vs.find(v=>/zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function say(text){ try{ if(!('speechSynthesis' in window)) { toast('이 브라우저는 음성을 지원하지 않아요'); return; } speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; if(zhVoice) u.voice=zhVoice; u.rate=0.85; speechSynthesis.speak(u); }catch(e){ toast('음성 재생이 안 돼요'); } }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-say]'); if(b){ e.stopPropagation(); say(b.dataset.say); } },true);
document.addEventListener('touchend',e=>{ const b=e.target.closest('[data-say]'); if(b){ e.stopPropagation(); } },true);

const CAT = `<img class="cat" src="${CAT_URI}" alt="">`;
const CAT2 = `<img class="cat" src="${CAT2_URI}" alt="">`;
function doneHTML(bubble,title,text,extra,cat){ return `<div class="done"><div class="bubble">${bubble}</div>${cat||CAT}<h2>${title}</h2><p>${text}</p>${extra||''}</div>`; }

function renderLearn(){
  ensureLearnBatch();
  const b=S.learnBatch, w=learnCurrent();
  $('#learnDone').textContent=b.pos; $('#learnTotal').textContent=b.ids.length||DAILY_NEW;
  $('#learnBar').style.width=(b.ids.length?100*b.pos/b.ids.length:0)+'%';
  $('#subtitle').textContent = `전체 ${S.learnedIdx}/${TOTAL}`;
  const st=$('#learnStage');
  if(S.learnedIdx>=TOTAL && !w){
    st.innerHTML=doneHTML('2,600개 전부 끝!','모든 단어 학습 완료!','2,600단어를 전부 봤어요.<br>이제 복습으로 오래 기억하기만 하면 돼요.');
    st.style.display='block'; $('#learnControls').style.display='none'; return;
  }
  if(!w){
    const list=b.ids.map(id=>BY_ID[id]);
    st.innerHTML=doneHTML('오늘도 '+b.ids.length+'개 해냈다냥','오늘의 단어학습 완료!','잘했어요! 내일 복습에서 다시 만나요.<br>아래에서 오늘 배운 단어를 다시 볼 수 있어요.')
      + `<div class="list" style="flex:none;overflow:visible;padding-bottom:24px">${list.map(x=>`<div class="row small"><div class="zh">${x.zh}</div><div class="meta"><div class="py">${x.py}</div><div class="ko">${koHTML(x)}</div></div></div>`).join('')}</div>`;
    st.style.display='block'; st.style.overflow='auto';
    $('#learnControls').style.display='none'; return;
  }
  st.style.display='flex'; st.style.overflow='';
  $('#learnControls').style.display='flex';
  st.innerHTML=cardHTML(w,{id:'learnCard',speak:true,hint:'왼쪽으로 밀면 다음, 오른쪽으로 밀면 이전'});
  if(autoSpeak) say(w.zh);
  $('#learnPrev').style.visibility = b.pos>0?'visible':'hidden';
  attachSwipe($('#learnCard'), {left:()=>learnAdvance(1), right:()=>learnAdvance(-1)});
}

function renderReview(){
  ensureRevQueue();
  const q=curQ(), w=revCurrent();
  $('#title').firstChild.textContent = (revMode==='wrong'?'틀린단어 복습':'복습하기')+' ';
  $('#revDone').textContent=q.pos; $('#revTotal').textContent=q.ids.length;
  $('#revBar').style.width=(q.ids.length?100*q.pos/q.ids.length:0)+'%';
  const totalDue=dueIds().length;
  $('#revInfo').textContent = revMode==='wrong' ? '' : (totalDue>q.ids.length ? `+${totalDue-q.ids.length} 이월` : '');
  const st=$('#reviewStage');
  if(!w){
    $('#reviewControls').style.display='none'; st.style.display='block'; st.style.overflow='auto';
    if(revMode==='wrong'){
      st.innerHTML=doneHTML('틀린 단어도 내 거다냥','틀린단어 복습 완료!',`${q.ids.length}개 중 ${q.known}개를 기억했어요.`+(q.wrong?`<br>아직 헷갈리는 ${q.wrong}개는 틀린 횟수가 올라갔어요.`:''),`<div class="rowbtns" style="width:100%;max-width:320px;margin-top:14px"><button class="btn primary" id="wrAgain">다시 한 번</button><button class="btn" id="wrBack">목록으로</button></div>`,CAT2);
      $('#wrAgain').onclick=()=>startWrongReview(); $('#wrBack').onclick=()=>showTab('wrong');
      return;
    }
    if(q.ids.length===0){
      const upcoming=Object.values(S.cards).filter(c=>c.stage<INTERVALS.length).map(c=>c.due).sort()[0];
      const msg = Object.keys(S.cards).length===0 ? '먼저 학습하기에서 새 단어를 보면, 다음 날부터 여기서 복습해요.'
        : upcoming ? `다음 복습은 ${upcoming} 예정이에요.` : '복습할 단어가 없어요.';
      st.innerHTML=doneHTML('오늘은 쉬는 날','오늘 복습할 단어가 없어요',msg);
    }else{
      const d=day();
      const wl=(d.wrongIds||[]).map(id=>BY_ID[id]);
      st.innerHTML=doneHTML('기억력 최고다냥','오늘의 복습 완료!',`잘했어요! ${q.ids.length}개 중 ${d.known}개를 기억했어요.`+(wl.length?`<br>오늘 틀린 ${wl.length}개는 아래에서 다시 봐요.`:''),'',CAT2)
        + (totalDue>0?`<div class="rowbtns" style="margin:4px 0 14px"><button class="btn primary" id="moreRev">미래의 나를 위해 ${Math.min(EXTRA_REVIEW,totalDue)}개 더 복습</button></div>`:'')
        + (wl.length?`<div class="listhead" style="padding-top:6px"><span>오늘 틀린 단어</span><span>${wl.length}개</span></div><div class="list" style="flex:none;overflow:visible;padding-bottom:24px">${wl.map(x=>`<div class="row small"><div class="zh">${x.zh}</div><div class="meta"><div class="py">${x.py}</div><div class="ko">${koHTML(x)}</div></div></div>`).join('')}</div>`:'');
      const mb=$('#moreRev'); if(mb) mb.onclick=extendReview;
    }
    return;
  }
  st.style.display='flex'; st.style.overflow='';
  $('#reviewControls').style.display='flex';
  const c=S.cards[w.id];
  const badge = revMode==='wrong' ? `${S.wrong[w.id]?S.wrong[w.id].count:0}회 틀림` : (c.stage===0 ? (S.wrong[w.id]?'다시 1일':'1일차') : `${INTERVALS[c.stage-1]}일 후 복습`);
  st.innerHTML=cardHTML(w,{id:'revCard',reverse:revReverse,speak:q.flipped,hideBack:!q.flipped,badge,hint:q.flipped?(revMode==='wrong'?'왼쪽으로 밀면 다음':'왼쪽으로 밀면 틀린단어로 저장하고 다음'):(autoOn?(AUTO_MS/1000).toFixed(1)+'초 뒤 자동으로 넘어가요 · 모르면 눌러서 뒤집기':'모르면 눌러서 뒤집기 · 알면 왼쪽으로 밀기')});
  const card=$('#revCard');
  if(q.flipped) card.classList.add('flipped');
  $('#revFlip').style.display = q.flipped?'none':'';
  $('#revKnow').textContent = q.flipped?'다음 →':'알아요';
  $('#revKnow').className = 'btn '+(q.flipped?'bad':'ok');
  attachSwipe(card,{left:()=>revAnswer(!curQ().flipped), tap:()=>flipReview()});
  clearTimeout(autoT);
  if(autoOn && !q.flipped){ const bar=document.createElement('div'); bar.className='timer'; card.appendChild(bar); bar.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:AUTO_MS,fill:'forwards'}); const mode=revMode, pos=q.pos; autoT=setTimeout(()=>{ if(autoOn && revMode===mode && curQ().pos===pos && !curQ().flipped) revAnswer(true); },AUTO_MS); }
}
const revReverse=false;
let autoOn=false, autoT=null, AUTO_MS=1300;
try{ AUTO_MS=+localStorage.getItem('hsk_auto_ms')||1300; }catch(e){}
function autoLabel(){ return '자동 '+(AUTO_MS/1000).toFixed(1)+'초'; }
$('#autoBtn').onclick=()=>{ autoOn=!autoOn; $('#autoBtn').textContent=autoOn?autoLabel():'자동 OFF'; $('#autoBtn').classList.toggle('on',autoOn); $('#picker').style.display=autoOn?'':'none'; if(autoOn) initPicker(); renderReview(); };
let pickerInit=false, pT=null;
function initPicker(){
  const sc=$('#pscroll');

    sc.addEventListener('scroll',()=>{ clearTimeout(pT); pT=setTimeout(()=>{ const c=sc.scrollLeft+sc.clientWidth/2; let best=null,bd=1e9; sc.querySelectorAll('span').forEach(el=>{ const m=el.offsetLeft+el.offsetWidth/2; const d=Math.abs(m-c); if(d<bd){bd=d;best=el;} }); if(best){ setAuto(+best.dataset.v); } },80); }); }
  requestAnimationFrame(()=>{ const el=sc.querySelector(`span[data-v="${AUTO_MS}"]`); if(el){ sc.scrollLeft=el.offsetLeft+el.offsetWidth/2-sc.clientWidth/2; } markPicker(); });

let wrongSort='count';
function currentWrongOrder(){ const all=Object.keys(S.wrong).map(Number); if(wrongSort==='count') return all.sort((a,b)=>{ const wa=S.wrong[a],wb=S.wrong[b]; if(wb.count!==wa.count) return wb.count-wa.count; return (wb.last||'')<(wa.last||'')?-1:1; }); if(wrongSort==='recent') return all.sort((a,b)=>{ const wa=S.wrong[a],wb=S.wrong[b]; if(wa.last!==wb.last) return wa.last<wb.last?1:-1; return wb.count-wa.count; }); return all.sort((a,b)=>{ const wa=S.wrong[a],wb=S.wrong[b]; const fa=wa.first||wa.last, fb=wb.first||wb.last; if(fa!==fb) return fa<fb?-1:1; return wb.count-wa.count; }); }

  if(wrongSort==='count') ids=all.sort((a,b)=>{ const wa=S.wrong[a],wb=S.wrong[b]; if(wb.count!==wa.count) return wb.count-wa.count; return (wb.last||'')<(wa.last||'')?-1:1; });
  else if(wrongSort==='recent') ids=all.sort((a,b)=>{ const wa=S.wrong[a],wb=S.wrong[b]; if(wa.last!==wb.last) return wa.last<wb.last?1:-1; return wb.count-wa.count; });
  else ids=all.sort((a,b)=>{ const wa=S.wrong[a],wb=S.wrong[b]; const fa=wa.first||wa.last, fb=wb.first||wb.last; if(fa!==fb) return fa<fb?-1:1; return wb.count-wa.count; });

/* ---------- swipe ---------- */
function attachSwipe(el, h){
  let sx=0, sy=0, dx=0, dy=0, active=false, moved=false, t0=0;
  const start=e=>{ const p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY; dx=dy=0; active=true; moved=false; t0=Date.now(); el.classList.add('dragging'); };
  const move=e=>{ if(!active) return; const p=e.touches?e.touches[0]:e; dx=p.clientX-sx; dy=p.clientY-sy; if(Math.abs(dx)>8) moved=true; if(Math.abs(dx)>Math.abs(dy)){ el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`; el.style.opacity=String(Math.max(.4,1-Math.abs(dx)/420)); } };
  const end=()=>{ if(!active) return; active=false; el.classList.remove('dragging');
    const v=Math.abs(dx)/Math.max(1,Date.now()-t0); const flick=Math.abs(dx)>18 && v>0.45;
    const th=flick?18:Math.min(48, el.offsetWidth*0.14);
    if(dx<-th && h.left){ el.style.transform='translateX(-120%) rotate(-10deg)'; el.style.opacity='0'; setTimeout(h.left,70); return; }
    if(dx>th && h.right){ el.style.transform='translateX(120%) rotate(10deg)'; el.style.opacity='0'; setTimeout(h.right,70); return; }
    el.style.transform=''; el.style.opacity='';
    if(!moved && h.tap) h.tap();
  };
  el.addEventListener('touchstart',start,{passive:true}); el.addEventListener('touchmove',move,{passive:true}); el.addEventListener('touchend',end); el.addEventListener('touchcancel',end);
  el.addEventListener('mousedown',e=>{ start(e); const mm=ev=>move(ev); const mu=()=>{ end(); window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); }; window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu); });
}

function stripTone(p){ return p.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ü/g,'v').toLowerCase().replace(/\s+/g,''); }
const PY_PLAIN={}; WORDS.forEach(w=>PY_PLAIN[w.id]=stripTone(w.py));
function wordStatus(id){ const c=S.cards[id]; if(!c) return '학습 전'; if(c.stage>=INTERVALS.length) return '완료'; return `복습 ${c.stage+1}단계`; }
function renderSearch(){
  const q=$('#searchBox').value.trim(); const el=$('#searchList');
  if(!q){ $('#searchCount').textContent='전체 2,600단어'; el.innerHTML='<div class="empty"><p>한자, 병음(성조 없이도 됨), 한국어 뜻으로 찾아요.</p></div>'; return; }

let calY, calM, calSel;
function renderCal(){
  const t=today(); if(calY===undefined){ calY=+t.slice(0,4); calM=+t.slice(5,7); calSel=t; }
  $('#calTitle').textContent=`${calY}년 ${calM}월`;
  const first=new Date(calY,calM-1,1), dim=new Date(calY,calM,0).getDate(), off=first.getDay();
  let h=['일','월','화','수','목','금','토'].map((d,i)=>`<div class="dow ${i===0?'sun':''}">${d}</div>`).join('');
  for(let i=0;i<off;i++) h+='<div class="cell empty"></div>';
  for(let d=1;d<=dim;d++){
    const key=`${calY}-${String(calM).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const x=S.days[key]; const tot=x?x.learned+x.reviewed:0;
    const cls=['cell', tot>0?(tot>=150?'act2':'act'):'', key===t?'today':'', key===calSel?'sel':'', key>t?'future':''].join(' ');
    h+=`<div class="${cls}" data-d="${key}"><span>${d}</span><div class="dots">${x&&x.learned?'<i class="dl"></i>':''}${x&&x.reviewed?'<i class="dr"></i>':''}</div></div>`;
  }
  $('#calGrid').innerHTML=h;
  $('#calGrid').querySelectorAll('.cell[data-d]').forEach(c=>c.onclick=()=>{ calSel=c.dataset.d; renderCal(); });
  const x=S.days[calSel]||{learned:0,reviewed:0,known:0,wrong:0};
  const [y,m,d]=calSel.split('-').map(Number);
  const learnedThatDay=Object.keys(S.cards).filter(id=>S.cards[id].seen===calSel).map(Number).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
  const wrongThatDay=(x.wrongIds||[]);
  const rowsOf=(ids)=>ids.map(id=>BY_ID[id]).map(w=>`<div class="row small"><div class="zh">${w.zh}</div><div class="meta"><div class="py">${w.py}</div><div class="ko">${koHTML(w)}</div></div></div>`).join('');
  $('#dayDetail').innerHTML=`<h3>${m}월 ${d}일 ${calSel===t?'(오늘)':''}</h3><div class="dd"><div><b style="color:#16a34a">${x.learned}</b><span>학습한 단어</span></div><div><b style="color:#d97706">${x.reviewed}</b><span>복습한 단어</span></div></div>`+
    (wrongThatDay.length?`<div class="listhead" style="padding-top:14px"><span>이날 틀린 단어</span><span>${wrongThatDay.length}개</span></div>${rowsOf(wrongThatDay)}`:'')+
    (learnedThatDay.length?`<div class="listhead" style="padding-top:14px"><span>이날 학습한 단어</span><span>${learnedThatDay.length}개</span></div>${rowsOf(learnedThatDay)}`:'')+
    (x.reviewed?`<p>복습 중 ${x.known}개 알았고 ${x.wrong}개 틀렸어요 (정답률 ${Math.round(100*x.known/x.reviewed)}%)</p>`:(x.learned?'':'<p>이 날은 기록이 없어요.</p>'));
}

function summary(){
  const t=today(); const d=day(t);
  const lv4=ORDER.slice(0,S.learnedIdx).filter(id=>BY_ID[id].lv===4).length, lv5=S.learnedIdx-lv4;
  const dist=[0,0,0,0,0,0,0]; Object.values(S.cards).forEach(c=>dist[Math.min(c.stage,6)]++);
  const last7=[]; for(let i=6;i>=0;i--){ const dd=addDays(t,-i); const x=S.days[dd]; last7.push(`${dd.slice(5)} 학습 ${x?x.learned:0} · 복습 ${x?x.reviewed:0}${x&&x.reviewed?` (정답 ${x.known})`:''}`); }
  const rev7=Object.entries(S.days).filter(([k])=>daysBetween(k,t)<7).reduce((a,[,x])=>{a.r+=x.reviewed;a.k+=x.known;return a;},{r:0,k:0});
  const wrongIds=Object.keys(S.wrong).map(Number).sort((a,b)=>S.wrong[b].count-S.wrong[a].count);
  const top=wrongIds.slice(0,15).map(id=>`${BY_ID[id].zh}(${S.wrong[id].count})`).join(' ');
  return [`📚 기솔의 HSK 5급 단어장 진도 (${t})`,
    `전체 학습 ${S.learnedIdx}/${TOTAL} · HSK4 ${lv4}/1000 · HSK5 ${lv5}/1600`,
    `오늘 학습 ${d.learned} · 복습 ${d.reviewed} (정답 ${d.known}, 틀림 ${d.wrong})`,
    `최근 7일 복습 정답률 ${rev7.r?Math.round(100*rev7.k/rev7.r):0}% (${rev7.k}/${rev7.r})`,
    `오늘 복습 대기 ${dueIds().length}개`,
    `단계별: 1일 ${dist[0]} · 3일 ${dist[1]} · 7일 ${dist[2]} · 14일 ${dist[3]} · 30일 ${dist[4]} · 60일 ${dist[5]} · 완료 ${dist[6]}`,
    `틀린단어 ${wrongIds.length}개${top?` / TOP: ${top}`:''}`,
    `--- 최근 7일 ---`, ...last7, `시작일 ${S.started}`].join('\n');
}

  // overall bar
  g.fillStyle='#6b7385'; g.font=`500 30px ${KO}`; g.fillText('전체 진도',110,585);
  g.fillStyle='#e3e7ef'; roundRect(g,260,592,560,16,8); g.fill(); g.fillStyle='#16b981'; roundRect(g,260,592,Math.max(16,560*S.learnedIdx/TOTAL),16,8); g.fill();
  g.fillStyle='#1f2433'; g.font=`700 30px ${KO}`; g.textAlign='right'; g.fillText(`${S.learnedIdx}/${TOTAL}`,970,585); g.textAlign='left';
  // stats row
  const stats=[[String(dueIds().length),'복습 대기'],[String(wrongIds.length),'틀린단어']];
  stats.forEach(([v,l],i)=>{ const x=70+i*480; g.fillStyle='#f6f8fb'; roundRect(g,x,690,460,170,28); g.fill(); g.fillStyle='#1f2433'; g.font=`700 64px ${KO}`; g.textAlign='center'; g.fillText(v,x+230,720); g.fillStyle='#6b7385'; g.font=`500 28px ${KO}`; g.fillText(l,x+230,800); g.textAlign='left'; });
  const cat=await loadSvg(); if(cat){ const h=210, w=h*cat.width/cat.height; const oc=document.createElement('canvas'); oc.width=w; oc.height=h; const og=oc.getContext('2d'); og.drawImage(cat,0,0,w,h); og.globalCompositeOperation='destination-in'; const gr=og.createLinearGradient(0,0,0,h); gr.addColorStop(0,'rgba(0,0,0,1)'); gr.addColorStop(.78,'rgba(0,0,0,1)'); gr.addColorStop(1,'rgba(0,0,0,0)'); og.fillStyle=gr; og.fillRect(0,0,w,h); g.drawImage(oc,1010-w,20); }
  return c;
}
let shareBlob=null;
$('#shareBtn').onclick=async()=>{
  const c=await renderShareCard();
  shareBlob=await new Promise(r=>c.toBlob(r,'image/png'));
  $('#shareImg').src=c.toDataURL('image/png');
  try{ const f=new File([shareBlob],'hsk-progress.png',{type:'image/png'}); $('#shareNative').style.display=(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]}))?'':'none'; }catch(e){ $('#shareNative').style.display='none'; }
  $('#shareBg').classList.add('open');
};
$('#closeShare').onclick=()=>$('#shareBg').classList.remove('open');
$('#shareBg').onclick=e=>{ if(e.target.id==='shareBg') $('#shareBg').classList.remove('open'); };
$('#shareNative').onclick=async()=>{ try{ const f=new File([shareBlob],'hsk-progress.png',{type:'image/png'}); await navigator.share({files:[f],title:'HSK 단어장 진도'}); }catch(e){ if(!(e&&e.name==='AbortError')){ toast('여기선 바로 보내기가 안 돼요'); $('#shareNative').style.display='none'; } } };
$('#shareCopyImg').onclick=async()=>{
  try{ await navigator.clipboard.write([new ClipboardItem({'image/png':shareBlob})]); toast('이미지를 복사했어요.<br>왓츠앱에 붙여넣기 하세요'); }
  catch(e){ toast('이미지 복사가 안 되면<br>이미지를 길게 눌러 저장해요'); }
};

/* ---------- font ---------- */
const FKEY='hsk_font2';
function applyFont(f){ document.body.className=document.body.className.replace(/\bf-\w+/g,'').trim(); document.body.classList.add('f-'+f); document.querySelectorAll('#fontpick button').forEach(b=>b.classList.toggle('on',b.dataset.f===f)); try{ localStorage.setItem(FKEY,f); }catch(e){} }
document.querySelectorAll('#fontpick button').forEach(b=>b.onclick=()=>applyFont(b.dataset.f));
let f0='plex'; try{ f0=localStorage.getItem(FKEY)||'plex'; }catch(e){} applyFont(f0);
function applyDark(on){ document.body.classList.toggle('dark',on); $('#darkBtn').classList.toggle('on',on); document.querySelector('meta[name=theme-color]').setAttribute('content',on?'#12141c':'#ffffff'); try{ localStorage.setItem('hsk_dark',on?'1':'0'); }catch(e){} }
$('#fontToggle').onclick=()=>{ const fp=$('#fontpick'); const open=fp.style.display==='none'; fp.style.display=open?'':'none'; $('#fontChev').classList.toggle('open',open); };
$('#speakBtn').classList.toggle('on',autoSpeak);
$('#speakBtn').onclick=()=>{ autoSpeak=!autoSpeak; $('#speakBtn').classList.toggle('on',autoSpeak); try{ localStorage.setItem('hsk_autospeak',autoSpeak?'1':'0'); }catch(e){} };
$('#darkBtn').onclick=()=>applyDark(!document.body.classList.contains('dark'));
try{ applyDark(localStorage.getItem('hsk_dark')==='1'); }catch(e){}

showTab('home');
})();
